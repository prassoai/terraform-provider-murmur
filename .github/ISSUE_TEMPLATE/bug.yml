name: Bug report
description: Report incorrect provider behavior
title: "Bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include credentials, customer data, or Terraform state. Report security vulnerabilities through the Security tab instead.
  - type: input
    id: provider_version
    attributes:
      label: Provider version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: terraform_version
    attributes:
      label: Terraform version
      placeholder: 1.15.0
    validations:
      required: true
  - type: textarea
    id: configuration
    attributes:
      label: Relevant configuration
      description: Provide the smallest redacted configuration that reproduces the problem.
      render: hcl
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Include relevant redacted errors or logs.
